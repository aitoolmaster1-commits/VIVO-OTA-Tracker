name: Build Vivo OTA Tracker EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyQt-Fluent-Widgets pywinstyles PyInstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          # Check if the folder exists and navigate into it
          if (Test-Path "VIVO-OTA-Tracker-main") {
              Write-Host "Entering VIVO-OTA-Tracker-main directory..."
              Set-Location "VIVO-OTA-Tracker-main"
          }

          # Run PyInstaller using the official spec file
          if (Test-Path "VivoOtaTracker.onefile.spec") {
              Write-Host "Building using VivoOtaTracker.onefile.spec..."
              pyinstaller VivoOtaTracker.onefile.spec --noconfirm
          } elseif (Test-Path "main.py") {
              Write-Host "Spec file not found, building directly from main.py..."
              pyinstaller --noconfirm --onedir --windowed --name "VivoOtaTracker" --add-data "src;src" --add-data "assets;assets" --add-data "libs;libs" --add-data "jre;jre" --add-data "unidbg-android-0.9.10-SNAPSHOT.jar;." --add-data "VivoOtaTracker.java;." main.py
          } else {
              Write-Error "Neither spec file nor main.py could be found!"
              exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VivoOtaTracker-Windows
          path: |
            **/dist/*.exe
            **/dist/VivoOtaTracker
